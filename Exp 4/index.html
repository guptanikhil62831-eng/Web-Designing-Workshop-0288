<!DOCTYPE html>
<html>
<head>
    <title>Hotel Room Booking Form</title>
</head>
<body>

    <h2>Hotel Room Booking Form</h2>

    <form>
        Full Name: <br>
        <input type="text" name="fullname"><br><br>

        Email: <br>
        <input type="email" name="email"><br><br>

        Phone: <br>
        <input type="text" name="phone"><br><br>

        Check-in Date: <br>
        <input type="date" name="checkin"><br><br>

        Check-out Date: <br>
        <input type="date" name="checkout"><br><br>

        Room Type: <br>
        <select name="roomtype">
            <option value="single">Single</option>
            <option value="double">Double</option>
            <option value="suite">Suite</option>
        </select><br><br>

        Number of Guests: <br>
        <input type="number" name="guests"><br><br>

        Special Requests: <br>
        <textarea name="requests" rows="3" cols="25"></textarea><br><br>

        <input type="reset" value="Reset Form">
        <input type="submit" value="Book Now">
    </form>

</body>
</html>
